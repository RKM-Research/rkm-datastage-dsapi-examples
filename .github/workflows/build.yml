name: Build examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore NuGet packages
        run: dotnet restore RKM.DataStage.Examples.slnx
      - name: Build examples
        run: dotnet build RKM.DataStage.Examples.slnx --configuration Release --no-restore
